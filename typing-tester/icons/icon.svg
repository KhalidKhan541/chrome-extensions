<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A29BFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <g transform="translate(64,64)">
    <!-- Keyboard base -->
    <rect x="-36" y="4" width="72" height="36" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Key rows -->
    <g fill="rgba(255,255,255,0.9)">
      <rect x="-30" y="10" width="8" height="8" rx="2"/>
      <rect x="-20" y="10" width="8" height="8" rx="2"/>
      <rect x="-10" y="10" width="8" height="8" rx="2"/>
      <rect x="0" y="10" width="8" height="8" rx="2"/>
      <rect x="10" y="10" width="8" height="8" rx="2"/>
      <rect x="20" y="10" width="8" height="8" rx="2"/>
      <rect x="-26" y="20" width="8" height="8" rx="2"/>
      <rect x="-16" y="20" width="8" height="8" rx="2"/>
      <rect x="-6" y="20" width="8" height="8" rx="2"/>
      <rect x="4" y="20" width="8" height="8" rx="2"/>
      <rect x="14" y="20" width="8" height="8" rx="2"/>
      <rect x="24" y="20" width="8" height="8" rx="2"/>
      <rect x="-18" y="30" width="36" height="8" rx="2"/>
    </g>
    <!-- Speed lines -->
    <g stroke="#FFD93D" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="-50" y1="-16" x2="-30" y2="-16"/>
      <line x1="-48" y1="-8" x2="-26" y2="-8"/>
      <line x1="-46" y1="0" x2="-22" y2="0"/>
    </g>
    <!-- Lightning bolt -->
    <polygon points="-8,-38 -2,-24 -10,-24 4,-6 -6,-6 -2,-22 6,-22" fill="#FFD93D" opacity="0.95"/>
  </g>
</svg>
