name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20.x'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        id: verify-tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Build all extensions
        run: npm run build

      - name: Package extensions as zip
        run: |
          mkdir -p dist
          for dir in */; do
            if [ -f "$dir/manifest.json" ]; then
              ext_name=$(basename "$dir")
              echo "Packaging $ext_name..."
              cd "$dir"
              zip -r "../dist/${ext_name}-v${TAG_VERSION}.zip" . \
                -x "*.git*" "node_modules/*" "tests/*" "*.test.js" "jest.config.js" \
                ".eslintrc*" ".prettierrc*" "README.md" "LICENSE" "scripts/*" \
                "coverage/*" ".github/*" "dist/*" "*.zip"
              cd ..
            fi
          done

      - name: List packaged extensions
        run: ls -la dist/

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          includeTypes: '["feat", "fix", "perf", "refactor", "docs", "style", "test", "chore"]'
          excludeTypes: '["ci", "build"]'
          sort: 'ASC'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.verify-tag.outputs.tag_version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Chrome Extensions Release v${{ steps.verify-tag.outputs.tag_version }}

            ${{ steps.changelog.outputs.changelog }}

            ### Extensions Included
            $(for f in dist/*.zip; do echo "- $(basename "$f" .zip)"; done)

            ### Installation
            Download the `.zip` file for the extension you want and load it as an unpacked extension in Chrome (Developer mode > Load unpacked).

          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chrome Web Store (optional)
        if: false
        uses: lannonbr/vscode-chrome-web-store-publish@main
        with:
          clientId: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          clientSecret: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          refreshToken: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          extensionId: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
          zipPath: dist/*.zip

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Send notification
        run: |
          echo "Release ${{ github.ref_name }} published successfully!"
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"