<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regex Tester</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M17.5 14.33L16.25 16.83L15 14.33C14.25 15.5 13 16.5 11.5 16.5C9 16.5 7 14.5 7 12C7 9.5 9 7.5 11.5 7.5C13 7.5 14.25 8.5 15 9.67L16.25 7.17L17.5 9.67C18.5 8 20 6.5 22 6.5V5C19.5 5 17.5 6 16.5 7.5C15.5 6 14 5 12 5C8.67 5 6 7.67 6 11C6 14.33 8.67 17 12 17C14 17 15.5 16 16.5 14.5C17.5 16 19.5 17 22 17V15.5C20 15.5 18.5 14.5 17.5 13V14.33Z"/>
        </svg>
        <h1>Regex Tester</h1>
      </div>
      <div class="header-actions">
        <button id="btn-history" class="icon-btn" title="History">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M13 3C9.23 3 6.19 5.95 6 9.66l-1.92 2.53c-.24.31 0 .81.42.81H6v3c0 1.1.9 2 2 2h1v3h7v-4.69c2.37-1.12 4-3.51 4-6.31 0-3.87-3.13-7-7-7zm2 10h-2v-2h2v2zm0-4h-2c0-3.25 2.75-5 5-5s5 1.75 5 5c0 2.95-2.23 4.78-4.33 5.43l-1.42-1.43C19.23 12.3 20 11.15 20 10c0-2.21-1.79-4-4-4s-4 1.79-4 4h-1c-.55 0-1 .45-1 1s.45 1 1 1h3z"/></svg>
        </button>
        <button id="btn-reference" class="icon-btn" title="Quick Reference">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
        </button>
        <button id="btn-save" class="icon-btn" title="Save Pattern">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        </button>
        <button id="btn-export" class="icon-btn" title="Export Matches">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <div class="main-content">
        <section class="regex-input-section">
          <label class="section-label">Pattern</label>
          <div class="regex-input-wrapper">
            <span class="regex-delimiter">/</span>
            <input type="text" id="regex-input" class="regex-input" placeholder="Enter regex pattern..." spellcheck="false" autocomplete="off">
            <span class="regex-delimiter">/</span>
            <div class="flags-container">
              <label class="flag-checkbox" title="Global search">
                <input type="checkbox" id="flag-g" value="g" checked>
                <span class="flag-label">g</span>
              </label>
              <label class="flag-checkbox" title="Case-insensitive">
                <input type="checkbox" id="flag-i" value="i">
                <span class="flag-label">i</span>
              </label>
              <label class="flag-checkbox" title="Multi-line">
                <input type="checkbox" id="flag-m" value="m">
                <span class="flag-label">m</span>
              </label>
              <label class="flag-checkbox" title="Dot matches newline">
                <input type="checkbox" id="flag-s" value="s">
                <span class="flag-label">s</span>
              </label>
              <label class="flag-checkbox" title="Unicode">
                <input type="checkbox" id="flag-u" value="u">
                <span class="flag-label">u</span>
              </label>
            </div>
          </div>
          <div id="regex-error" class="error-message hidden"></div>
          <div id="regex-stats" class="stats-bar hidden">
            <span id="match-count">0 matches</span>
            <span id="exec-time"></span>
          </div>
        </section>

        <section class="test-string-section">
          <label class="section-label">Test String</label>
          <div class="test-string-wrapper">
            <div id="highlighted-string" class="highlighted-string"></div>
            <textarea id="test-string" class="test-string" placeholder="Enter test string..." spellcheck="false"></textarea>
          </div>
        </section>

        <section class="results-section">
          <div class="results-header">
            <label class="section-label">Match Details</label>
            <div class="results-tabs">
              <button class="tab-btn active" data-tab="matches">Matches</button>
              <button class="tab-btn" data-tab="groups">Groups</button>
              <button class="tab-btn" data-tab="explanation">Explanation</button>
            </div>
          </div>
          <div id="results-content" class="results-content">
            <div id="tab-matches" class="tab-panel active">
              <div class="empty-state">
                <svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M17.5 14.33L16.25 16.83L15 14.33C14.25 15.5 13 16.5 11.5 16.5C9 16.5 7 14.5 7 12C7 9.5 9 7.5 11.5 7.5C13 7.5 14.25 8.5 15 9.67L16.25 7.17L17.5 9.67C18.5 8 20 6.5 22 6.5V5C19.5 5 17.5 6 16.5 7.5C15.5 6 14 5 12 5C8.67 5 6 7.67 6 11C6 14.33 8.67 17 12 17C14 17 15.5 16 16.5 14.5C17.5 16 19.5 17 22 17V15.5C20 15.5 18.5 14.5 17.5 13V14.33Z"/></svg>
                <p>Enter a pattern and test string to see matches</p>
              </div>
            </div>
            <div id="tab-groups" class="tab-panel">
              <div id="groups-list" class="groups-list"></div>
            </div>
            <div id="tab-explanation" class="tab-panel">
              <div id="explanation-content" class="explanation-content"></div>
            </div>
          </div>
        </section>
      </div>

      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-header">
            <label class="section-label">Pattern Library</label>
            <input type="text" id="library-search" class="sidebar-search" placeholder="Search patterns...">
          </div>
          <div id="pattern-library" class="pattern-library"></div>
        </div>

        <div class="sidebar-section hidden" id="reference-panel">
          <div class="sidebar-header">
            <label class="section-label">Quick Reference</label>
            <button id="close-reference" class="close-btn">&times;</button>
          </div>
          <div id="reference-content" class="reference-content"></div>
        </div>

        <div class="sidebar-section hidden" id="history-panel">
          <div class="sidebar-header">
            <label class="section-label">History</label>
            <button id="clear-history" class="clear-btn">Clear</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="save-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Save Pattern</h3>
      <input type="text" id="save-name" class="modal-input" placeholder="Pattern name...">
      <textarea id="save-description" class="modal-textarea" placeholder="Description (optional)"></textarea>
      <div class="modal-actions">
        <button id="save-cancel" class="btn-secondary">Cancel</button>
        <button id="save-confirm" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="export-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Export Matches</h3>
      <div class="export-options">
        <label class="export-option">
          <input type="radio" name="export-format" value="json" checked>
          <span>JSON</span>
        </label>
        <label class="export-option">
          <input type="radio" name="export-format" value="csv">
          <span>CSV</span>
        </label>
        <label class="export-option">
          <input type="radio" name="export-format" value="text">
          <span>Plain Text</span>
        </label>
      </div>
      <div id="export-preview" class="export-preview"></div>
      <div class="modal-actions">
        <button id="export-cancel" class="btn-secondary">Cancel</button>
        <button id="export-copy" class="btn-primary">Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <script src="regex-engine.js"></script>
  <script src="pattern-library.js"></script>
  <script src="regex-reference.js"></script>
  <script src="popup.js"></script>
</body>
</html>
