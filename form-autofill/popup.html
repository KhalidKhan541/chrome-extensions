<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form AutoFill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <svg class="logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M7 8h10M7 12h10M7 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M17 14l2 2-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Form AutoFill</h1>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- Main View -->
    <div id="main-view" class="view active">
      <div class="section">
        <label class="label">Active Profile</label>
        <div class="profile-selector">
          <select id="profile-select"></select>
          <button id="edit-profile-btn" class="icon-btn-sm" title="Edit Profile">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <label class="label">Profiles</label>
          <button id="new-profile-btn" class="text-btn">+ New</button>
        </div>
        <div id="profile-list" class="profile-list"></div>
      </div>

      <div class="actions">
        <button id="detect-btn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          Detect Form
        </button>
        <button id="fill-btn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Fill Form
        </button>
      </div>

      <div class="section">
        <div class="section-header">
          <label class="label">Quick Fill</label>
        </div>
        <div class="quick-fill-grid">
          <button class="quick-fill-btn" data-field="name">Name</button>
          <button class="quick-fill-btn" data-field="email">Email</button>
          <button class="quick-fill-btn" data-field="phone">Phone</button>
          <button class="quick-fill-btn" data-field="address">Address</button>
          <button class="quick-fill-btn" data-field="company">Company</button>
          <button class="quick-fill-btn" data-field="card">Card</button>
        </div>
      </div>
    </div>

    <!-- Profile Editor View -->
    <div id="editor-view" class="view">
      <div class="view-header">
        <button id="back-btn" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2 id="editor-title">New Profile</h2>
        <button id="save-profile-btn" class="text-btn">Save</button>
      </div>

      <div class="form-group">
        <label class="label" for="profile-name">Profile Name</label>
        <input type="text" id="profile-name" class="input" placeholder="e.g., Personal, Work">
      </div>

      <div class="fields-editor">
        <div class="section-header">
          <label class="label">Fields</label>
        </div>
        <div id="fields-container"></div>
        <button id="add-field-btn" class="btn btn-outline btn-block">+ Add Field</button>
      </div>

      <div class="editor-actions">
        <button id="export-profile-btn" class="btn btn-secondary">Export</button>
        <button id="delete-profile-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>

    <!-- Import View -->
    <div id="import-view" class="view">
      <div class="view-header">
        <button id="import-back-btn" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2>Import Profile</h2>
      </div>
      <div class="form-group">
        <label class="label" for="import-data">Paste Profile Data (JSON)</label>
        <textarea id="import-data" class="input textarea" rows="10" placeholder='{"name":"My Profile","fields":{...}}'></textarea>
      </div>
      <button id="import-confirm-btn" class="btn btn-primary btn-block">Import</button>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="view">
      <div class="view-header">
        <button id="settings-back-btn" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2>Settings</h2>
      </div>

      <div class="settings-group">
        <div class="setting-row">
          <span class="setting-label">Highlight filled fields</span>
          <label class="toggle">
            <input type="checkbox" id="setting-highlight" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Show context menu</span>
          <label class="toggle">
            <input type="checkbox" id="setting-context-menu" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Auto-detect forms</span>
          <label class="toggle">
            <input type="checkbox" id="setting-auto-detect">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-group">
        <label class="label">Highlight Color</label>
        <div class="color-options">
          <button class="color-btn active" data-color="#4ade80" style="background:#4ade80"></button>
          <button class="color-btn" data-color="#60a5fa" style="background:#60a5fa"></button>
          <button class="color-btn" data-color="#f472b6" style="background:#f472b6"></button>
          <button class="color-btn" data-color="#fbbf24" style="background:#fbbf24"></button>
          <button class="color-btn" data-color="#a78bfa" style="background:#a78bfa"></button>
        </div>
      </div>

      <div class="settings-group">
        <button id="export-all-btn" class="btn btn-secondary btn-block">Export All Profiles</button>
        <button id="import-btn" class="btn btn-secondary btn-block">Import Profiles</button>
        <button id="reset-btn" class="btn btn-danger btn-block">Reset All Data</button>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="status-bar hidden">
      <span id="status-text"></span>
    </div>
  </div>

  <script src="profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
