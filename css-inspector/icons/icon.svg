<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#2d2d30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007acc"/>
      <stop offset="100%" style="stop-color:#1a8ad4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Magnifying glass -->
  <circle cx="54" cy="54" r="28" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <line x1="74" y1="74" x2="98" y2="98" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- Code brackets inside lens -->
  <text x="40" y="64" font-family="monospace" font-size="28" font-weight="bold" fill="#007acc">&lt;/&gt;</text>
  <!-- Corner brackets for inspector feel -->
  <path d="M16 40 L16 16 L40 16" fill="none" stroke="#4ec9b0" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 16 L112 16 L112 40" fill="none" stroke="#4ec9b0" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 88 L112 112 L88 112" fill="none" stroke="#4ec9b0" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 112 L16 112 L16 88" fill="none" stroke="#4ec9b0" stroke-width="3" stroke-linecap="round"/>
</svg>
