<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocker Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg class="shield-icon" viewBox="0 0 100 100" width="32" height="32">
          <path d="M50 5 L90 20 L90 50 C90 75 70 95 50 100 C30 95 10 75 10 50 L10 20 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
          <path d="M50 15 L80 28 L80 50 C80 70 65 88 50 92 C35 88 20 70 20 50 L20 28 Z" fill="#2c3e50"/>
          <rect x="42" y="35" width="16" height="30" rx="2" fill="#e74c3c"/>
          <rect x="35" y="42" width="30" height="16" rx="2" fill="#e74c3c"/>
        </svg>
        <h1>Website Blocker Pro</h1>
      </div>
      <div class="header-actions">
        <button id="focusToggle" class="toggle-btn" title="Focus Mode">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Focus Mode Banner -->
    <div id="focusBanner" class="focus-banner hidden">
      <div class="focus-info">
        <span class="pulse"></span>
        <span>Focus Mode Active</span>
      </div>
      <button id="endFocus" class="btn-small btn-danger">End Focus</button>
    </div>

    <!-- Stats Section -->
    <section class="stats-section">
      <div class="stat-card">
        <span class="stat-number" id="blockedToday">0</span>
        <span class="stat-label">Blocked Today</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="timeSaved">0m</span>
        <span class="stat-label">Time Saved</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="totalBlocked">0</span>
        <span class="stat-label">Total Blocked</span>
      </div>
    </section>

    <!-- Quick Add Section -->
    <section class="quick-add-section">
      <div class="input-group">
        <input type="text" id="siteInput" placeholder="Enter website (e.g., facebook.com)" autocomplete="off">
        <button id="addSiteBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <button id="addCurrentBtn" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Add Current Site
      </button>
    </section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="blocked">Blocked</button>
      <button class="tab" data-tab="schedule">Schedule</button>
      <button class="tab" data-tab="whitelist">Whitelist</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <!-- Blocked Sites Tab -->
    <section id="blockedTab" class="tab-content active">
      <ul id="blockList" class="site-list"></ul>
      <p id="emptyBlocked" class="empty-state">No blocked sites yet. Add one above!</p>
    </section>

    <!-- Schedule Tab -->
    <section id="scheduleTab" class="tab-content">
      <div class="schedule-form">
        <input type="text" id="scheduleSite" placeholder="Website to block">
        <div class="time-inputs">
          <label>
            Start
            <input type="time" id="scheduleStart" value="09:00">
          </label>
          <label>
            End
            <input type="time" id="scheduleEnd" value="17:00">
          </label>
        </div>
        <div class="days-selector">
          <button class="day-btn" data-day="0">S</button>
          <button class="day-btn" data-day="1">M</button>
          <button class="day-btn" data-day="2">T</button>
          <button class="day-btn" data-day="3">W</button>
          <button class="day-btn" data-day="4">T</button>
          <button class="day-btn" data-day="5">F</button>
          <button class="day-btn" data-day="6">S</button>
        </div>
        <button id="addScheduleBtn" class="btn-primary">Add Schedule</button>
      </div>
      <ul id="scheduleList" class="schedule-list"></ul>
      <p id="emptySchedule" class="empty-state">No schedules configured.</p>
    </section>

    <!-- Whitelist Tab -->
    <section id="whitelistTab" class="tab-content">
      <div class="input-group">
        <input type="text" id="whitelistInput" placeholder="Add exception (e.g., work.company.com)">
        <button id="addWhitelistBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <ul id="whitelist" class="site-list whitelist"></ul>
      <p id="emptyWhitelist" class="empty-state">No whitelist entries.</p>
    </section>

    <!-- History Tab -->
    <section id="historyTab" class="tab-content">
      <div class="history-controls">
        <button id="clearHistory" class="btn-small btn-danger">Clear History</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <p id="emptyHistory" class="empty-state">No blocked attempts yet.</p>
    </section>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="closeSettings" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>
              <input type="checkbox" id="enableNotifications">
              Enable notifications
            </label>
          </div>
          <div class="setting-group">
            <label>
              <input type="checkbox" id="enableCounters">
              Show blocked page counter
            </label>
          </div>
          <div class="setting-group">
            <label>
              <input type="checkbox" id="passwordProtect">
              Password protect settings
            </label>
          </div>
          <div id="passwordSection" class="hidden">
            <input type="password" id="extensionPassword" placeholder="Set password">
          </div>
          <div class="setting-group">
            <label>Time saved per block (seconds)</label>
            <input type="number" id="timePerBlock" value="30" min="5" max="300">
          </div>
          <div class="setting-group">
            <h3>Data Management</h3>
            <div class="btn-group">
              <button id="exportBtn" class="btn-secondary">Export</button>
              <button id="importBtn" class="btn-secondary">Import</button>
              <input type="file" id="importFile" accept=".json" class="hidden">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="blocker-engine.js"></script>
  <script src="schedule-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
