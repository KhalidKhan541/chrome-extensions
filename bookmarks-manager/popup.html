<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks Manager Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L12 22M5 8L12 2L19 8" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="10" width="18" height="12" rx="2"/>
          </svg>
          <span>Bookmarks Pro</span>
        </div>
        <button class="btn-icon" id="toggleSidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-content">
        <!-- Quick Actions -->
        <div class="sidebar-section">
          <button class="sidebar-btn" id="btnAddBookmark" title="Add bookmark">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Add Bookmark</span>
          </button>
          <button class="sidebar-btn" id="btnAllBookmarks">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <span>All Bookmarks</span>
            <span class="badge" id="totalCount">0</span>
          </button>
          <button class="sidebar-btn" id="btnRecentlyAdded">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
            </svg>
            <span>Recently Added</span>
          </button>
          <button class="sidebar-btn" id="btnBulkSelect">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
            <span>Bulk Select</span>
          </button>
        </div>

        <!-- Folders -->
        <div class="sidebar-section">
          <div class="section-header">
            <span>Folders</span>
            <button class="btn-icon-sm" id="btnNewFolder" title="New folder">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
          </div>
          <div class="folder-tree" id="folderTree"></div>
        </div>

        <!-- Tags -->
        <div class="sidebar-section">
          <div class="section-header">
            <span>Tags</span>
          </div>
          <div class="tag-list" id="tagList"></div>
        </div>
      </div>

      <!-- Import/Export -->
      <div class="sidebar-footer">
        <button class="btn-sm" id="btnImport" title="Import bookmarks">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Import
        </button>
        <button class="btn-sm" id="btnExport" title="Export bookmarks">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          Export
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="search-container">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search bookmarks by name, URL, or tags...">
          <button class="btn-icon-sm search-clear" id="searchClear" title="Clear search">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="top-bar-actions">
          <select id="sortSelect" class="sort-select" title="Sort bookmarks">
            <option value="date-desc">Newest First</option>
            <option value="date-asc">Oldest First</option>
            <option value="name-asc">Name A-Z</option>
            <option value="name-desc">Name Z-A</option>
          </select>
          <button class="btn-icon" id="btnRefresh" title="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bulk Action Bar (hidden by default) -->
      <div class="bulk-bar hidden" id="bulkBar">
        <span id="bulkCount">0 selected</span>
        <div class="bulk-actions">
          <select id="bulkFolderSelect" class="bulk-select">
            <option value="">Move to folder...</option>
          </select>
          <button class="btn-sm" id="btnBulkMove">Move</button>
          <button class="btn-sm btn-accent" id="btnBulkTag">Add Tag</button>
          <button class="btn-sm btn-danger" id="btnBulkDelete">Delete</button>
          <button class="btn-sm" id="btnBulkCancel">Cancel</button>
        </div>
      </div>

      <!-- Bookmark List -->
      <div class="bookmark-list" id="bookmarkList">
        <div class="empty-state" id="emptyState">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2L12 22M5 8L12 2L19 8" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="10" width="18" height="12" rx="2"/>
          </svg>
          <h3>No bookmarks found</h3>
          <p>Add your first bookmark or adjust your search</p>
        </div>
      </div>

      <!-- Context Menu -->
      <div class="context-menu hidden" id="contextMenu">
        <button class="ctx-item" data-action="edit">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Edit
        </button>
        <button class="ctx-item" data-action="tags">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
            <circle cx="7" cy="7" r="1"/>
          </svg>
          Tags
        </button>
        <button class="ctx-item" data-action="open">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
          </svg>
          Open in Tab
        </button>
        <button class="ctx-item" data-action="duplicate">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Duplicate
        </button>
        <div class="ctx-separator"></div>
        <button class="ctx-item ctx-danger" data-action="delete">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
          Delete
        </button>
      </div>

      <!-- Modals -->
      <div class="modal-overlay hidden" id="modalOverlay">
        <!-- Add/Edit Bookmark Modal -->
        <div class="modal hidden" id="bookmarkModal">
          <div class="modal-header">
            <h3 id="modalTitle">Add Bookmark</h3>
            <button class="btn-icon-sm modal-close" id="closeModal">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editBookmarkId">
            <div class="form-group">
              <label for="bmName">Name</label>
              <input type="text" id="bmName" placeholder="Bookmark name">
            </div>
            <div class="form-group">
              <label for="bmUrl">URL</label>
              <input type="url" id="bmUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
              <label for="bmFolder">Folder</label>
              <select id="bmFolder" class="form-select"></select>
            </div>
            <div class="form-group">
              <label for="bmTags">Tags</label>
              <div class="tag-input-container">
                <div class="tag-chips" id="tagChips"></div>
                <input type="text" id="bmTags" placeholder="Add tag and press Enter" class="tag-input">
                <div class="tag-suggestions hidden" id="tagSuggestions"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" id="cancelModal">Cancel</button>
            <button class="btn btn-primary" id="saveBookmark">Save</button>
          </div>
        </div>

        <!-- Folder Modal -->
        <div class="modal hidden" id="folderModal">
          <div class="modal-header">
            <h3>New Folder</h3>
            <button class="btn-icon-sm modal-close" id="closeFolderModal">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="folderName">Folder Name</label>
              <input type="text" id="folderName" placeholder="My Bookmarks">
            </div>
            <div class="form-group">
              <label for="folderParent">Parent Folder</label>
              <select id="folderParent" class="form-select"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" id="cancelFolderModal">Cancel</button>
            <button class="btn btn-primary" id="saveFolder">Create</button>
          </div>
        </div>

        <!-- Tag Edit Modal -->
        <div class="modal hidden" id="tagModal">
          <div class="modal-header">
            <h3>Edit Tags</h3>
            <button class="btn-icon-sm modal-close" id="closeTagModal">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="tagEditId">
            <div class="tag-input-container">
              <div class="tag-chips" id="editTagChips"></div>
              <input type="text" id="editTagInput" placeholder="Add tag and press Enter" class="tag-input">
              <div class="tag-suggestions hidden" id="editTagSuggestions"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" id="cancelTagModal">Cancel</button>
            <button class="btn btn-primary" id="saveTags">Save</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="bookmark-manager.js"></script>
  <script src="tag-manager.js"></script>
  <script src="search-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
