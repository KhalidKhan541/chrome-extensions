<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Scheduler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <path d="M12 14l2 2 4-4"/>
        </svg>
        <h1>Social Scheduler</h1>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="settingsBtn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="compose">Compose</button>
      <button class="tab-btn" data-tab="queue">Queue <span class="badge" id="queueBadge">0</span></button>
      <button class="tab-btn" data-tab="drafts">Drafts</button>
    </nav>

    <main class="app-main">
      <!-- Compose Tab -->
      <section class="tab-content active" id="composeTab">
        <div class="compose-section">
          <div class="platform-selector">
            <label class="platform-label">Platforms:</label>
            <div class="platform-chips">
              <label class="platform-chip" data-platform="twitter">
                <input type="checkbox" name="platform" value="twitter">
                <span class="chip-content">
                  <svg class="platform-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                  </svg>
                  <span>X</span>
                </span>
              </label>
              <label class="platform-chip" data-platform="linkedin">
                <input type="checkbox" name="platform" value="linkedin">
                <span class="chip-content">
                  <svg class="platform-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                  </svg>
                  <span>LinkedIn</span>
                </span>
              </label>
              <label class="platform-chip" data-platform="facebook">
                <input type="checkbox" name="platform" value="facebook">
                <span class="chip-content">
                  <svg class="platform-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                  </svg>
                  <span>Facebook</span>
                </span>
              </label>
              <label class="platform-chip" data-platform="instagram">
                <input type="checkbox" name="platform" value="instagram">
                <span class="chip-content">
                  <svg class="platform-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.359-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.061-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678c-3.405 0-6.162 2.76-6.162 6.162 0 3.405 2.76 6.162 6.162 6.162 3.405 0 6.162-2.76 6.162-6.162 0-3.405-2.76-6.162-6.162-6.162zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405c0 .795-.646 1.44-1.44 1.44-.795 0-1.44-.646-1.44-1.44 0-.794.646-1.439 1.44-1.439.793-.001 1.44.645 1.44 1.439z"/>
                  </svg>
                  <span>Instagram</span>
                </span>
              </label>
            </div>
          </div>

          <div class="compose-area">
            <div class="textarea-wrapper">
              <textarea id="postContent" placeholder="What's on your mind? Start composing your post..." rows="5"></textarea>
              <div class="textarea-footer">
                <div class="char-counter" id="charCounter">
                  <span id="charCount">0</span> / <span id="charLimit">280</span>
                </div>
                <div class="char-warnings" id="charWarnings"></div>
              </div>
            </div>
          </div>

          <div class="formatting-bar">
            <button class="fmt-btn" id="addHashtag" title="Add Hashtag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="9" x2="20" y2="9"/>
                <line x1="4" y1="15" x2="20" y2="15"/>
                <line x1="10" y1="3" x2="8" y2="21"/>
                <line x1="16" y1="3" x2="14" y2="21"/>
              </svg>
            </button>
            <button class="fmt-btn" id="addMention" title="Add Mention">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/>
                <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
              </svg>
            </button>
            <button class="fmt-btn" id="addEmoji" title="Add Emoji">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                <line x1="9" y1="9" x2="9.01" y2="9"/>
                <line x1="15" y1="9" x2="15.01" y2="9"/>
              </svg>
            </button>
            <div class="fmt-separator"></div>
            <button class="fmt-btn" id="attachImage" title="Attach Image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" hidden>
          </div>

          <div class="image-preview" id="imagePreview" style="display: none;">
            <img id="previewImage" src="" alt="Preview">
            <button class="remove-image" id="removeImage">×</button>
          </div>

          <div class="platform-previews" id="platformPreviews"></div>

          <div class="schedule-section">
            <div class="schedule-options">
              <button class="schedule-btn active" id="postNowBtn">Post Now</button>
              <button class="schedule-btn" id="scheduleBtn">Schedule</button>
            </div>
            <div class="schedule-picker" id="schedulePicker" style="display: none;">
              <div class="datetime-row">
                <input type="date" id="scheduleDate">
                <input type="time" id="scheduleTime">
              </div>
              <div class="recurring-option">
                <label class="checkbox-label">
                  <input type="checkbox" id="recurringCheck">
                  <span class="checkmark"></span>
                  <span>Repeat</span>
                </label>
                <select id="recurringInterval" disabled>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>
              </div>
            </div>
          </div>

          <div class="action-buttons">
            <button class="btn btn-secondary" id="saveDraftBtn">Save Draft</button>
            <button class="btn btn-primary" id="publishBtn">Post Now</button>
          </div>
        </div>
      </section>

      <!-- Queue Tab -->
      <section class="tab-content" id="queueTab">
        <div class="queue-header">
          <h2>Scheduled Posts</h2>
          <div class="queue-actions">
            <button class="btn-icon" id="exportQueue" title="Export Queue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
            </button>
            <button class="btn-icon" id="importQueue" title="Import Queue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </button>
            <button class="btn-icon" id="clearQueue" title="Clear Queue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="queue-list" id="queueList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <p>No scheduled posts yet</p>
            <span>Compose a post and schedule it to see it here</span>
          </div>
        </div>
      </section>

      <!-- Drafts Tab -->
      <section class="tab-content" id="draftsTab">
        <div class="drafts-header">
          <h2>Saved Drafts</h2>
        </div>
        <div class="drafts-list" id="draftsList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <p>No saved drafts</p>
            <span>Your drafts will appear here</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Settings</h3>
          <button class="btn-close" id="closeSettings">×</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>Default Platforms</label>
            <div class="setting-chips">
              <label class="chip"><input type="checkbox" id="defaultTwitter"> X/Twitter</label>
              <label class="chip"><input type="checkbox" id="defaultLinkedin"> LinkedIn</label>
              <label class="chip"><input type="checkbox" id="defaultFacebook"> Facebook</label>
              <label class="chip"><input type="checkbox" id="defaultInstagram"> Instagram</label>
            </div>
          </div>
          <div class="setting-group">
            <label>Notification Reminders</label>
            <select id="reminderTime">
              <option value="5">5 minutes before</option>
              <option value="15" selected>15 minutes before</option>
              <option value="30">30 minutes before</option>
              <option value="60">1 hour before</option>
            </select>
          </div>
          <div class="setting-group">
            <label>Timezone</label>
            <select id="timezone"></select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
          <button class="btn btn-primary" id="saveSettings">Save Settings</button>
        </div>
      </div>
    </div>

    <!-- Emoji Picker Modal -->
    <div class="modal emoji-modal" id="emojiModal">
      <div class="modal-content emoji-content">
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="platform-connector.js"></script>
  <script src="scheduler.js"></script>
  <script src="queue-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
