<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" fill="currentColor"/>
        </svg>
        <h1>Video Downloader Pro</h1>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="detect">Detect</button>
      <button class="tab" data-tab="manual">Manual</button>
      <button class="tab" data-tab="history">History</button>
    </div>

    <div class="tab-content active" id="detectTab">
      <div class="section">
        <h2 class="section-title">Current Page Videos</h2>
        <button class="btn btn-primary" id="detectBtn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z" fill="currentColor"/>
          </svg>
          Detect Videos on Page
        </button>
        <div id="videoList" class="video-list">
          <p class="empty-state">No videos detected yet. Click "Detect Videos" to scan the current page.</p>
        </div>
      </div>
    </div>

    <div class="tab-content" id="manualTab">
      <div class="section">
        <h2 class="section-title">Download from URL</h2>
        <div class="input-group">
          <input type="url" id="videoUrl" class="input" placeholder="Enter video URL...">
          <button class="btn btn-secondary" id="parseUrlBtn">Parse</button>
        </div>
        <div id="manualResult" class="manual-result"></div>
      </div>
    </div>

    <div class="tab-content" id="historyTab">
      <div class="section">
        <h2 class="section-title">Download History</h2>
        <button class="btn btn-small" id="clearHistoryBtn">Clear History</button>
        <div id="historyList" class="history-list">
          <p class="empty-state">No downloads yet.</p>
        </div>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="section">
        <h2 class="section-title">Settings</h2>
        <div class="setting-item">
          <label for="defaultQuality">Default Quality</label>
          <select id="defaultQuality" class="select">
            <option value="best">Best Available</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="downloadFolder">Download Folder</label>
          <input type="text" id="downloadFolder" class="input" placeholder="Downloads">
        </div>
        <div class="setting-item">
          <label for="autoDetect">Auto-detect Videos</label>
          <input type="checkbox" id="autoDetect" class="checkbox" checked>
        </div>
        <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="video-formats.js"></script>
  <script src="download-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
