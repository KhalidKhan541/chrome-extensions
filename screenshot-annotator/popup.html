<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Annotator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 9h2M19 9h2M3 15h2M19 15h2M9 3v2M15 3v2M9 19v2M15 19v2"/>
        </svg>
        <span class="logo-text">Annotator</span>
      </div>
    </header>

    <div class="main-content">
      <section class="capture-section">
        <h3 class="section-title">Capture</h3>
        <div class="capture-buttons">
          <button id="btn-visible" class="capture-btn" title="Capture visible tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            <span>Visible Tab</span>
          </button>
          <button id="btn-fullpage" class="capture-btn" title="Capture full page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M12 8v8M8 12l4 4 4-4"/>
            </svg>
            <span>Full Page</span>
          </button>
          <button id="btn-selection" class="capture-btn" title="Capture selection">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 3v4M5 3h4M19 3v4M19 3h-4M5 21v-4M5 21h4M19 21v-4M19 21h-4"/>
              <rect x="5" y="5" width="14" height="14" rx="1" stroke-dasharray="3 3"/>
            </svg>
            <span>Selection</span>
          </button>
        </div>
      </section>

      <section class="editor-section" id="editor-section">
        <div class="toolbar">
          <div class="tool-group">
            <h3 class="section-title">Tools</h3>
            <div class="tool-buttons">
              <button id="tool-arrow" class="tool-btn" data-tool="arrow" title="Arrow (A)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 19L19 5M19 5H10M19 5v9"/>
                </svg>
              </button>
              <button id="tool-rectangle" class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="5" width="18" height="14" rx="1"/>
                </svg>
              </button>
              <button id="tool-circle" class="tool-btn" data-tool="circle" title="Circle (C)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"/>
                </svg>
              </button>
              <button id="tool-text" class="tool-btn" data-tool="text" title="Text (T)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 4h12M12 4v16M8 20h8"/>
                </svg>
              </button>
              <button id="tool-highlight" class="tool-btn" data-tool="highlight" title="Highlight (H)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 3l9 9-9 9-9-9z"/>
                  <path d="M3 12h6M15 12h6"/>
                </svg>
              </button>
              <button id="tool-line" class="tool-btn" data-tool="line" title="Line (L)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 19L19 5"/>
                </svg>
              </button>
              <button id="tool-pen" class="tool-btn" data-tool="pen" title="Pen (P)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 3l4 4L7 21H3v-4L17 3z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="tool-group">
            <h3 class="section-title">Style</h3>
            <div class="style-controls">
              <div class="color-picker-wrap">
                <label>Color</label>
                <input type="color" id="color-picker" value="#ff0000" class="color-picker">
              </div>
              <div class="stroke-width-wrap">
                <label>Width</label>
                <input type="range" id="stroke-width" min="1" max="20" value="3" class="stroke-slider">
                <span id="stroke-width-val">3</span>
              </div>
              <div class="font-size-wrap" id="font-size-wrap" style="display:none;">
                <label>Font</label>
                <select id="font-size" class="font-select">
                  <option value="14">14px</option>
                  <option value="18" selected>18px</option>
                  <option value="24">24px</option>
                  <option value="32">32px</option>
                  <option value="48">48px</option>
                </select>
              </div>
            </div>
          </div>

          <div class="tool-group">
            <div class="action-row">
              <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 10h10a5 5 0 0 1 0 10H9"/>
                  <path d="M3 10l4-4M3 10l4 4"/>
                </svg>
              </button>
              <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10H11a5 5 0 0 0 0 10h4"/>
                  <path d="M21 10l-4-4M21 10l-4 4"/>
                </svg>
              </button>
              <button id="btn-clear" class="action-btn" title="Clear all annotations">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="canvas-container" id="canvas-container">
          <canvas id="annotation-canvas"></canvas>
          <canvas id="preview-canvas"></canvas>
        </div>

        <div class="export-bar">
          <button id="btn-save-png" class="export-btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12M12 15l-4-4M12 15l4-4"/>
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            PNG
          </button>
          <button id="btn-save-jpg" class="export-btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12M12 15l-4-4M12 15l4-4"/>
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            JPG
          </button>
          <button id="btn-copy" class="export-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy
          </button>
        </div>
      </section>

      <section class="history-section" id="history-section">
        <h3 class="section-title">History</h3>
        <div class="history-list" id="history-list">
          <p class="empty-state">No captures yet</p>
        </div>
      </section>
    </div>
  </div>

  <script src="capture-utils.js"></script>
  <script src="annotation-editor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
