<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="8" cy="8" r="6" fill="#FF6B6B"/>
          <circle cx="16" cy="8" r="6" fill="#4ECDC4"/>
          <circle cx="12" cy="15" r="6" fill="#45B7D1"/>
        </svg>
        <h1>Color Palette</h1>
      </div>
    </header>

    <section class="upload-section">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="upload-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <p>Drop an image here or <span class="upload-link">browse</span></p>
        </div>
        <img id="previewImage" class="preview-image hidden" alt="Preview">
      </div>
    </section>

    <section class="controls-section">
      <button class="btn btn-primary" id="extractBtn" disabled>Extract Colors</button>
    </section>

    <section class="palette-section hidden" id="paletteSection">
      <h2>Generated Palette</h2>
      <div class="palette-display" id="paletteDisplay"></div>
    </section>

    <section class="harmony-section hidden" id="harmonySection">
      <h2>Color Harmony</h2>
      <div class="harmony-options">
        <button class="harmony-btn" data-harmony="complementary">Complementary</button>
        <button class="harmony-btn" data-harmony="analogous">Analogous</button>
        <button class="harmony-btn" data-harmony="triadic">Triadic</button>
        <button class="harmony-btn" data-harmony="split">Split-Comp</button>
        <button class="harmony-btn" data-harmony="tetradic">Tetradic</button>
      </div>
      <div class="harmony-palette" id="harmonyPalette"></div>
    </section>

    <section class="picker-section">
      <h2>Manual Picker</h2>
      <div class="picker-row">
        <input type="color" id="manualColor" value="#4ECDC4">
        <span class="picker-label" id="pickerLabel">#4ECDC4</span>
        <button class="btn btn-sm" id="addManualBtn">Add to Palette</button>
      </div>
    </section>

    <section class="save-section" id="saveSection">
      <h2>Save Palette</h2>
      <div class="save-row">
        <input type="text" id="paletteName" placeholder="Palette name..." class="text-input">
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </section>

    <section class="blindness-section hidden" id="blindnessSection">
      <h2>Color Blindness Preview</h2>
      <div class="blindness-options">
        <button class="blindness-btn" data-type="protanopia">Protanopia</button>
        <button class="blindness-btn" data-type="deuteranopia">Deuteranopia</button>
        <button class="blindness-btn" data-type="tritanopia">Tritanopia</button>
        <button class="blindness-btn" data-type="achromatopsia">Achromatopsia</button>
      </div>
      <div class="blindness-palette" id="blindnessPalette"></div>
    </section>

    <section class="export-section hidden" id="exportSection">
      <h2>Export</h2>
      <div class="export-buttons">
        <button class="btn btn-export" data-format="css">CSS Variables</button>
        <button class="btn btn-export" data-format="tailwind">Tailwind</button>
        <button class="btn btn-export" data-format="scss">SCSS</button>
        <button class="btn btn-export" data-format="json">JSON</button>
        <button class="btn btn-export" data-format="text">Plain Text</button>
      </div>
      <pre class="export-preview" id="exportPreview"></pre>
      <button class="btn btn-sm" id="copyExport">Copy to Clipboard</button>
    </section>

    <section class="saved-section">
      <h2>Saved Palettes</h2>
      <div class="saved-list" id="savedList">
        <p class="empty-state">No saved palettes yet.</p>
      </div>
    </section>
  </div>

  <script src="color-extractor.js"></script>
  <script src="color-harmony.js"></script>
  <script src="color-blindness.js"></script>
  <script src="export-formatter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
